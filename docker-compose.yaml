# Pinned so the project name does not follow the directory: renaming the
# folder would otherwise orphan the running containers into an old project.
name: doppler

services:
  bot:
    build: .
    container_name: doppler_discord_bot
    restart: unless-stopped
    # Plugin code runs in this process and can read anything the process can,
    # so this container is given only what the bot itself needs. The session
    # secret and the OAuth client secret are the dashboard's business and never
    # appear here.
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Seeded into the music plugin's own settings on first run. Not withheld,
      # because the plugin needs them and therefore has them either way.
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-}
      - LAVALINK_URI=${LAVALINK_URI:-}
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
    volumes:
      - .:/app
      # .env is mounted over with an empty file: the project bind mount would
      # otherwise hand every secret in it to any installed plugin.
      - /dev/null:/app/.env:ro
      # The two directories that decide what is trusted and what gets loaded.
      # Only the broker may write them.
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
    depends_on:
      # service_healthy, not a bare dependency: a bare one waits only for the
      # container to exist. The bot asks the broker for sidecars the moment its
      # plugins load, and it was winning that race by a fraction of a second --
      # the request failed and the music plugin came up with no Lavalink at all.
      broker:
        condition: service_healthy

  web:
    build: .
    container_name: doppler_web_dashboard
    restart: unless-stopped
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - BROKER_URL=http://doppler_service_broker:8002
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - bot

  # Starts the sidecar containers plugins declare in their manifests, installs
  # plugins from configured sources, and owns the trust configuration. This is
  # the only container with access to the Docker socket -- the bot, which runs
  # plugin code, deliberately has none.
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    container_name: doppler_service_broker
    restart: unless-stopped
    environment:
      # Bind mounts are resolved by the daemon on the host, so the broker needs
      # to know where this project lives from the host's point of view.
      - HOST_PROJECT_DIR=${PWD}
      # Provider keys may be set in .env on a first install; they are seeded
      # into the broker's own store and never handed to the bot.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
    healthcheck:
      # urllib rather than curl: this image has Python and little else.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
      # The writable side of the two directories the bot only reads.
      - ./config:/config
      - ./plugins:/plugins
      # Provider API keys. Mounted here and nowhere else -- in particular not
      # in the bot, so plugin code cannot read them.
      - ./secrets:/secrets
    expose:
      - "8002"
