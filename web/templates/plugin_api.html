<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin API — Doppler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* The body of this page is rendered from documentation.md, so it arrives
           as plain HTML with no classes. Everything below styles those bare
           elements; editing the reference means editing the markdown, not this. */
        .doc { color: #d1d5db; font-size: .875rem; line-height: 1.7; }
        .doc h1 { display: none; }
        .doc h2 {
            color: #fff; font-size: 1.5rem; font-weight: 700;
            margin: 2.5rem 0 .75rem; padding-top: .5rem;
        }
        .doc h2:first-child { margin-top: 0; }
        .doc h3 {
            color: #fff; font-size: 1rem; font-weight: 700; margin: 1.75rem 0 .5rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .doc p { margin: .75rem 0; }
        .doc a { color: #818cf8; }
        .doc a:hover { text-decoration: underline; }
        .doc strong { color: #fff; }
        .doc ul { list-style: disc; padding-left: 1.25rem; margin: .75rem 0; }
        .doc li { margin: .3rem 0; }
        .doc pre {
            tab-size: 4; background: #1e1f22; border: 1px solid #3f4147;
            border-radius: .5rem; padding: .75rem; overflow-x: auto;
            margin: .75rem 0; font-size: .78rem; line-height: 1.55;
        }
        .doc pre code { background: none; border: 0; padding: 0; color: #d1d5db; }
        .doc code {
            background: #1e1f22; border: 1px solid #3f4147; border-radius: .25rem;
            padding: .05rem .3rem; font-size: .85em; color: #c7d2fe;
        }
        .doc blockquote {
            border-left: 3px solid #f59e0b; background: #2b2d31;
            padding: .6rem .9rem; margin: 1rem 0; border-radius: 0 .375rem .375rem 0;
            color: #fcd34d; font-size: .8rem;
        }
        .doc blockquote strong { color: #fde68a; }
        .doc blockquote p { margin: .25rem 0; }
        .doc table {
            width: 100%; text-align: left; font-size: .75rem; margin: 1rem 0;
            border: 1px solid #3f4147; border-radius: .5rem; border-collapse: collapse;
            display: block; overflow-x: auto;
        }
        .doc thead { background: #2b2d31; color: #9ca3af; text-transform: uppercase; }
        .doc th, .doc td { padding: .6rem 1rem; }
        .doc tbody tr { border-top: 1px solid #3f4147; background: #232428; }
        .doc td:first-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #a5b4fc; }
        .doc h2[id], .doc h3[id] { scroll-margin-top: 5rem; }
        /* The in-document table of contents; the sidebar already does this job. */
        .doc > ul:first-of-type { display: none; }
        .toc ul { list-style: none; padding: 0; margin: 0; }
        .toc a {
            display: block; padding: .375rem .75rem; border-radius: .25rem;
            color: #9ca3af; font-size: .75rem; transition: all .15s;
        }
        .toc a:hover { background: #2b2d31; color: #fff; }
    </style>
</head>

<body class="bg-[#1e1f22] text-gray-200 min-h-screen font-sans">

    <header class="sticky top-0 z-10 bg-[#2b2d31] border-b border-[#3f4147] shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-lg font-bold text-white">🧩 Plugin API</h1>
                <span class="text-[10px] font-mono text-gray-400 bg-[#1e1f22] border border-[#3f4147] rounded px-2 py-0.5">
                    API {{ api_version }}
                </span>
                <span class="text-[10px] font-mono text-gray-500">Doppler {{ version }}</span>
            </div>
            <a href="/" class="text-xs text-gray-400 hover:text-white transition font-semibold">← Back to dashboard</a>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 py-8 flex gap-8">

        <nav class="hidden lg:block w-52 shrink-0">
            <div class="sticky top-20 toc">{{ toc|safe }}</div>
        </nav>

        <main class="flex-1 min-w-0 doc">{{ content|safe }}</main>

    </div>

    <footer class="max-w-6xl mx-auto px-6 py-8 text-center text-[11px] text-gray-600 border-t border-[#2b2d31] mt-8">
        Doppler {{ version }} · Plugin API {{ api_version }} ·
        <a href="https://github.com/omka-1337/doppler/blob/releases/documentation.md"
           class="text-gray-500 hover:text-gray-300">source</a>
    </footer>

</body>

</html>
